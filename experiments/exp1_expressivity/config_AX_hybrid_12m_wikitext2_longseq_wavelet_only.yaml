name: hybrid_12m_wikitext2_longseq_wavelet_only
model:
  use_analytical_decomp: true
  enabled_lanes:
    - wavelet
  num_lanes: 1
  hidden_dim: 384
  max_seq_len: 4096
  decomposition:
    causal: true
    poly_order: 4
  recomposition:
    depth: shallow
  context_block:
    enabled: true
    position: both
    block_type: conv
    depth: 1
    kernel_size: 3
    dropout: 0.1
    causal: true
training:
  learning_rate: 0.0003
  batch_size: 8
  max_steps: 8000
  save_interval: 1000
dataset_name: wikitext:wikitext-2-raw-v1
train_split: train
val_split: validation
checkpoint_dir: ./checkpoints/phase5/wavelet_only
