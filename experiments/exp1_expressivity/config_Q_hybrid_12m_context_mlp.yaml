name: hybrid_12m_context_mlp
model:
  use_analytical_decomp: true
  enabled_lanes:
    - poly
    - trig
    - wavelet
  num_lanes: 3
  hidden_dim: 384
  decomposition:
    causal: true
    poly_order: 4
  recomposition:
    depth: shallow
  context_block:
    enabled: true
    position: both
    block_type: mlp
    depth: 1
    hidden_multiplier: 2.0
    dropout: 0.1
training:
  learning_rate: 0.0003
  batch_size: 32
  max_steps: 8000
dataset_name: roneneldan/TinyStories
