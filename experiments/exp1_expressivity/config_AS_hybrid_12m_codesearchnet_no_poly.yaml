name: hybrid_12m_codesearchnet_no_poly
model:
  use_analytical_decomp: true
  enabled_lanes:
    - trig
    - wavelet
  num_lanes: 2
  hidden_dim: 384
  decomposition:
    causal: true
    poly_order: 4
  recomposition:
    depth: shallow
  context_block:
    enabled: true
    position: both
    block_type: conv
    depth: 1
    kernel_size: 3
    dropout: 0.1
    causal: true
training:
  learning_rate: 0.0002
  batch_size: 32
  max_steps: 10000
dataset_name: json:train=data/codesearchnet/python_train.jsonl,validation=data/codesearchnet/python_valid.jsonl
train_split: train
val_split: validation
