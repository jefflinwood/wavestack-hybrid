name: hybrid_12m_schedule
model:
  use_analytical_decomp: true
  enabled_lanes:
    - poly
    - trig
    - wavelet
  num_lanes: 3
  hidden_dim: 384
  decomposition:
    causal: true
    poly_order: 4
    num_freqs: 64
    wavelet_levels: 3
    schedule: true
    schedule_steps: 1000
    poly_order_min: 1
    num_freqs_min: 8
    wavelet_levels_min: 1
  recomposition:
    depth: shallow
  context_block:
    enabled: true
    position: both
    block_type: conv
    depth: 1
    kernel_size: 3
    dropout: 0.1
    causal: true
training:
  learning_rate: 0.0003
  batch_size: 32
  max_steps: 8000
dataset_name: roneneldan/TinyStories
