name: hybrid_12m_openwebtext10k
model:
  use_analytical_decomp: true
  enabled_lanes:
    - poly
    - trig
    - wavelet
  num_lanes: 3
  hidden_dim: 384
  decomposition:
    causal: true
    poly_order: 4
  recomposition:
    depth: shallow
  context_block:
    enabled: true
    position: both
    block_type: conv
    depth: 1
    kernel_size: 3
    dropout: 0.1
    causal: true
training:
  learning_rate: 0.0003
  batch_size: 32
  max_steps: 8000
dataset_name: stas/openwebtext-10k
train_split: train
val_split: train
