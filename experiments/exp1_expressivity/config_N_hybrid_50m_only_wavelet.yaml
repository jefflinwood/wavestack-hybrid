name: hybrid_50m_only_wavelet
model:
  use_analytical_decomp: true
  enabled_lanes:
    - wavelet
  num_lanes: 1
  hidden_dim: 768
  decomposition:
    causal: true
    poly_order: 4
  recomposition:
    depth: deep
training:
  learning_rate: 0.00015
  batch_size: 16
  max_steps: 12000
dataset_name: roneneldan/TinyStories
