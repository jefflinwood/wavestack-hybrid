name: hybrid_50m
model:
  use_analytical_decomp: true
  hidden_dim: 768
  decomposition:
    causal: true
    poly_order: 4
  recomposition:
    depth: deep
  context_block:
    enabled: true
    position: both
    block_type: conv
    depth: 1
    kernel_size: 3
    dropout: 0.1
    causal: true
training:
  learning_rate: 0.00015
  batch_size: 16
  max_steps: 12000
dataset_name: roneneldan/TinyStories
