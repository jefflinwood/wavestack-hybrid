[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavestack-hybrid"
version = "0.1.0"
description = "Hybrid analytical-neural WaveStack research stack"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "WaveStack Contributors" }]
license = { text = "Proprietary" }
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.24.0",
  "tiktoken>=0.5.0",
  "PyWavelets>=1.4.1",
  "datasets>=2.14.0",
  "wandb>=0.15.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "pytest>=7.4.0",
  "PyYAML>=6.0",
  "tqdm>=4.65.0"
]

[project.urls]
Repository = "https://github.com/jefflinwood/wavestack_hybrid"

[tool.hatch.build.targets.wheel]
packages = ["src/wavestack_hybrid"]

[tool.hatch.build.targets.sdist]
include = ["src/wavestack_hybrid", "README.md", "AGENTS.md", "PLAN.md"]
